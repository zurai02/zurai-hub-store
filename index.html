<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Script Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">RBX<span>ScriptHub</span></div>
    </header>

    <main class="container">
        <!-- New Script Direct Browser Input Form -->
        <section class="form-section">
            <h2>Add Direct Browser Script</h2>
            <form id="script-form">
                <div class="form-group">
                    <label for="script-title">Script Name</label>
                    <input type="text" id="script-title" placeholder="e.g., Infinite Jump, Fly Tool" required>
                </div>
                <div class="form-group">
                    <label for="script-content">Lua Code Payload</label>
                    <textarea id="script-content" rows="8" placeholder="-- Paste your Lua script block content here..." required></textarea>
                </div>
                <button type="submit" class="btn-primary">Add Code to Hub</button>
            </form>
        </section>

        <!-- Dynamic List Dashboard Grid -->
        <section class="list-section">
            <h2>Active Script Collection</h2>
            <div id="scripts-container" class="scripts-grid">
                <p style="color: var(--text-muted);">Syncing files from configuration index...</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
