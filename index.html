<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Script Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">RBX<span>ScriptHub</span></div>
    </header>

    <main class="container">
        <!-- Configuration Notice -->
        <section class="info-section">
            <h2>Script Hub Dashboard</h2>
            <p>To manage your scripts, update the entries inside your <code>posts.json</code> file on GitHub.</p>
        </section>

        <!-- Scripts Grid Layout -->
        <section class="list-section">
            <h2>Available Scripts</h2>
            <div id="scripts-container" class="scripts-grid">
                <p style="color: var(--text-muted);">Loading scripts from posts.json...</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
