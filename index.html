<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zurai Hub Store — Roblox Script Repository</title>
    <!-- Pointing to the new uncached css file name -->
    <link rel="stylesheet" href="style-v2.css">
</head>
<body>
    <!-- Fluid background mesh layer -->
    <div class="animated-bg"></div>

    <header>
        <div class="header-content">
            <div class="logo">Zurai<span>HubStore</span></div>
            <div class="status-badge"><span class="pulse-dot"></span> Network Live</div>
        </div>
    </header>

    <main class="container">
        <!-- Interactive Search Container Layer -->
        <div class="search-container">
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="Filter through available scripts...">
            </div>
        </div>

        <section class="list-section">
            <h2>Active Script Repositories</h2>
            <div id="scripts-container" class="scripts-grid">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Synchronizing script manifest dependencies...</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Pointing to the new uncached javascript file name -->
    <script src="app-v2.js"></script>
</body>
</html>
